<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DocCraft" />

    <!-- Primary SEO -->
    <title>DocCraft – Free PDF, Doc & Code Tools Online</title>
    <meta name="description" content="All-in-one free toolkit: merge, split, compress, convert PDFs; format JSON, SQL, HTML; convert images; generate QR codes. 60+ tools, no signup." />
    <meta name="keywords" content="PDF tools, merge PDF, compress PDF, PDF to Word, Word to PDF, JSON beautifier, SQL formatter, image converter, free online tools, DocCraft" />
    <meta name="author" content="DocCraft" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pdftools.anilsofttech.com/" />

    <!-- Google Search Console verification -->
    <!-- Replace YOUR_VERIFICATION_CODE with the code from Search Console -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DocCraft" />
    <meta property="og:title" content="DocCraft – Free PDF, Doc & Code Tools Online" />
    <meta property="og:description" content="All-in-one free toolkit: merge, split, compress, convert PDFs; format JSON, SQL, HTML; convert images; generate QR codes. 60+ tools, no signup." />
    <meta property="og:url" content="https://pdftools.anilsofttech.com/" />
    <meta property="og:image" content="https://pdftools.anilsofttech.com/icons/icon.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DocCraft – Free PDF, Doc & Code Tools Online" />
    <meta name="twitter:description" content="60+ free tools: PDF, JSON, SQL, image converters and more. No signup needed." />
    <meta name="twitter:image" content="https://pdftools.anilsofttech.com/icons/icon.svg" />

    <!-- JSON-LD: WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DocCraft",
      "url": "https://pdftools.anilsofttech.com",
      "description": "All-in-one free online tools for PDF, documents, images, and code. No signup required.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pdftools.anilsofttech.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DocCraft",
      "url": "https://pdftools.anilsofttech.com",
      "logo": "https://pdftools.anilsofttech.com/icons/icon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://pdftools.anilsofttech.com/contact"
      }
    }
    </script>

    <!-- Google Analytics 4 -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <style>
      * { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif !important; }
    </style>
  </head>
